name: Bridge verification
on:
  pull_request:
  push:
    branches: [feat/fork-integration]
permissions:
  contents: read
concurrency:
  group: bridge-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODE_MODE_NO_OP: "1"
    defaults:
      run:
        working-directory: code-mode-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: code-mode-mcp/package-lock.json
      - run: npm ci
      - run: npm test
